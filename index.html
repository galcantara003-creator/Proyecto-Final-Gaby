<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Empresarial - Dashboard Ejecutivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar Corporativo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Nexus Empresarial</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link" href="conversor.html">CONVERSOR</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">CONTACTO</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header / Banner Ejecutivo -->
    <header class="bg-primary text-white text-center py-5 mb-4">
        <div class="container">
            <h1 class="display-4 fw-bold">Dashboard Ejecutivo</h1>
            <p class="lead">Resumen de mercado y divisas operativas para la toma de decisiones</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row text-center mb-4" id="dashboard-rates">
            <!-- Spinner de Carga -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando indicadores...</span>
                </div>
                <p class="mt-2 text-muted">Consultando indicadores financieros...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">Escuela Bancaria y Comercial (EBC)</p>
        <p class="mb-0 text-muted small">Gabriela Alcántara Aguilar | Septiembre 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
