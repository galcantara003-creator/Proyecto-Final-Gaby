<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Empresarial - Simulador Operativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Nexus Empresarial</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link active" href="conversor.html">CONVERSOR</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">CONTACTO</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5 justify-content-center">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg col-md-12 mx-auto p-4 border-0">
                    <h1 class="text-center mb-2 h3 fw-bold">Convertidor de Divisas Corporativo</h1>
                    <p class="text-muted text-center mb-4">Herramienta para presupuestos y cotizaciones empresariales</p>
                    
                    <form id="conversor-form">
                        <div class="mb-3">
                            <label for="monto" class="form-label fw-bold">Monto:</label>
                            <input type="number" id="monto" class="form-control form-control-lg" placeholder="0.00" value="1000" min="1" step="any" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6 mb-2">
                                <label for="origen" class="form-label fw-bold">Moneda de origen:</label>
                                <select id="origen" class="form-select">
                                    <option value="USD" selected>USD (Moneda de origen)</option>
                                    <option value="EUR">EUR</option>
                                    <option value="GBP">GBP</option>
                                    <option value="JPY">JPY</option>
                                    <option value="MXN">MXN</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-2">
                                <label for="destino" class="form-label fw-bold">Moneda de destino:</label>
                                <select id="destino" class="form-select">
                                    <option value="MXN" selected>MXN (Moneda de destino)</option>
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="GBP">GBP</option>
                                    <option value="JPY">JPY</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-3 fw-bold py-2">Convertir</button>
                    </form>

                    <div id="resultado-container" class="mt-4 text-center d-none">
                        <div class="p-3 bg-light rounded border">
                            <h2 class="h5 text-muted">Resultado:</h2>
                            <p class="display-5 text-center text-primary fw-bold my-2" id="resultado-monto">0.00 MXN</p>
                            <p class="text-muted text-center small mb-0" id="conversion-timestamp"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">Escuela Bancaria y Comercial (EBC)</p>
        <p class="mb-0 text-muted small">Gabriela Alcántara Aguilar | Septiembre 2026</p>
    </footer>

    <script src="conversor.js"></script>
</body>
</html>
